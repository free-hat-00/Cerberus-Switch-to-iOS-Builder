name: Verify private EMS connectivity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  network-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose GitHub OIDC identity (safe claim fields only)
        env:
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.parse,urllib.request
          url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep="&" if "?" in url else "?"
          url+=sep+"audience="+urllib.parse.quote(os.environ["TS_AUDIENCE"],safe="")
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req,timeout=20) as response:
              payload=json.load(response)
          token=payload["value"]
          middle=token.split(".")[1]
          claims=json.loads(base64.urlsafe_b64decode(middle+"="*(-len(middle)%4)))
          for key in ("iss","sub","repository","ref","event_name"):
              print(key+": "+str(claims.get(key)))
          print("audience matches configured value:", claims.get("aud")==os.environ["TS_AUDIENCE"])
          PY
      - name: Join Tailscale with GitHub OIDC (no SSH or game secrets)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-builder

      - name: Verify allowed and denied TCP connections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket, sys
          checks = [
              ("EMS SSH permitted", "100.72.251.28", 22, True),
              ("EMS SMB blocked", "100.72.251.28", 445, False),
              ("Cerberus SSH blocked", "cerberus.corvus-gamut.ts.net", 22, False),
          ]
          failures = []
          for label, host, port, should_connect in checks:
              try:
                  with socket.create_connection((host, port), timeout=4):
                      connected = True
              except (OSError, TimeoutError):
                  connected = False
              if connected != should_connect:
                  print(f"FAIL: {label}")
                  failures.append(label)
              else:
                  print(f"PASS: {label}")
          if failures:
              print("Network isolation failed or a required destination is unavailable.")
              sys.exit(1)
          print("Network-only smoke test passed. SFTP credentials and game assets were not accessed.")
          PY
