name: NxNative private EMS builder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Opaque EMS staging ID (from scripts/stage-ems.ps1)'
        required: true
        type: string
      device:
        description: 'iOS device texture path'
        required: true
        type: choice
        default: 'standard'
        options:
          - standard
          - bc-fallback
      profile_id:
        description: 'Optional 16-character hexadecimal shader profile override'
        required: false
        type: string
      romfs:
        description: 'RomFS packaging'
        required: true
        type: choice
        default: bundle
        options:
          - bundle

permissions:
  contents: read
  id-token: write

concurrency:
  group: nxnative-private-build
  cancel-in-progress: false

jobs:
  build:
    # Public repo: deliberately disabled pending a game-free macOS preflight and build review.
    if: vars.ENABLE_PRIVATE_BUILDS == 'true'
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Verify input and required configuration
        env:
          BUILD_ID: ${{ inputs.build_id }}
          PROFILE_ID: ${{ inputs.profile_id }}
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          EMS_KEY: ${{ secrets.EMS_SSH_PRIVATE_KEY }}
          EMS_HOSTKEY: ${{ secrets.EMS_SSH_KNOWN_HOSTS }}
          EMS_USER: ${{ secrets.EMS_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" =~ ^[A-Za-z0-9_-]{12,40}$ ]] || { echo "::error::Invalid opaque build ID"; exit 1; }
          [[ -z "$PROFILE_ID" || "$PROFILE_ID" =~ ^[a-fA-F0-9]{16}$ ]] || { echo "::error::Invalid profile ID"; exit 1; }
          for var in TS_ID TS_AUDIENCE EMS_KEY EMS_HOSTKEY EMS_USER; do
            [[ -n "${!var}" ]] || { echo "::error::Required secret is not configured"; exit 1; }
          done
          [[ "$(uname -m)" == arm64 ]] || { echo "::error::Apple Silicon runner required"; exit 1; }
          # GitHub xcode-27 image may default to 27.1; explicitly select stable 27.2.
          test -d /Applications/Xcode_27.2.app/Contents/Developer || {
            echo "::error::Xcode 27.2 installation not present"; exit 1;
          }
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          python3 - <<'PY'
          import subprocess
          v = tuple(int(x) for x in subprocess.check_output(["sw_vers", "-productVersion"],text=True).strip().split(".")[:2])
          if v < (26, 6):
              raise SystemExit("macOS 26.6 or newer required")
          PY
          python3 - <<'PY'
          import re, subprocess
          x = subprocess.check_output(["xcodebuild", "-version"], text=True)
          m = re.search(r'Xcode (\d+)\.(\d+)', x)
          if not m or tuple(map(int, m.groups())) < (27, 2):
              raise SystemExit("Xcode 27.2 or newer is required")
          PY

      - name: Checkout standard nxnative
        if: inputs.device == 'standard'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seedds/nxnative
          ref: c9b122713037ba23de9eb46ee67531f03167bd23
          persist-credentials: false

      - name: Checkout legacy BC fallback fork
        if: inputs.device == 'bc-fallback'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3
          persist-credentials: false

      - name: Checkout audited builder validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: builder-control
          persist-credentials: false

      - name: Configure Python and .NET
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Install nxnative build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang unar
          python -m pip install lz4 'capstone>=5,<6' fonttools nsz zbic backports.zstd
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -downloadPlatform iOS

      - name: Join private Tailscale network
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-builder

      - name: Configure pinned EMS SSH host and key
        env:
          EMS_KEY: ${{ secrets.EMS_SSH_PRIVATE_KEY }}
          EMS_HOSTKEY: ${{ secrets.EMS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EMS_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$EMS_HOSTKEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Retrieve staged inputs privately from EMS
        env:
          BUILD_ID: ${{ inputs.build_id }}
          EMS_USER: ${{ secrets.EMS_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game-files" "$RUNNER_TEMP/private-inputs"
          # Chrooted EMS internal-sftp exposes only /in and /out.
          base="/in/$BUILD_ID"
          cat > "$RUNNER_TEMP/get.sftp" <<EOF
          get "$base/game.tar" "$RUNNER_TEMP/private-inputs/game.tar"
          get "$base/prod.keys" "$RUNNER_TEMP/private-inputs/prod.keys"
          EOF
          if ! sftp -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -b "$RUNNER_TEMP/get.sftp" "$EMS_USER@ems.corvus-gamut.ts.net" > "$RUNNER_TEMP/private-input-transfer.log" 2>&1; then
            echo "::error::Private input transfer failed; detailed output withheld."
            exit 1
          fi
          echo "Private inputs retrieved from EMS."
          test -s "$RUNNER_TEMP/private-inputs/game.tar"
          test -s "$RUNNER_TEMP/private-inputs/prod.keys"
          chmod 600 "$RUNNER_TEMP/private-inputs/prod.keys"
          python3 "$GITHUB_WORKSPACE/builder-control/scripts/validate-build-inputs.py" \
            "$RUNNER_TEMP/private-inputs/game.tar" "$RUNNER_TEMP/game-files"

      - name: Build unsigned IPA with resource diagnostics
        env:
          PROFILE_ID: ${{ inputs.profile_id }}
          ROMFS_MODE: ${{ inputs.romfs }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROMFS_MODE" == bundle ]] || { echo "::error::Separate RomFS output transfer is not yet implemented"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/build-diagnostics"
          # Keep resource sampling outside the build log; no process arguments, keys,
          # environment variables, or game contents are sampled.
          (
            while :; do
              printf '\n===== UTC %s =====\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              df -Pk "$RUNNER_TEMP"
              vm_stat | head -n 9 || true
              sleep 20
            done
          ) > "$RUNNER_TEMP/build-diagnostics/resources.log" 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT INT TERM
          args=("$RUNNER_TEMP/game-files" -k "$RUNNER_TEMP/private-inputs/prod.keys" -o "$RUNNER_TEMP/NxNative.ipa" --romfs "$ROMFS_MODE")
          if [[ -n "$PROFILE_ID" ]]; then export DM_GAME="${PROFILE_ID^^}"; fi
          cat > "$RUNNER_TEMP/sanitize-progress.py" <<'PY'
          import json
          import math
          import sys

          def category(name):
              value = str(name or "").lower()
              if value.startswith("extract"): return "Input extraction"
              if value.startswith("check"): return "Input validation"
              if value.startswith("rewrite"): return "Code rewriting"
              if value.startswith("nro capture"): return "Runtime capture"
              if value.startswith("shader split"): return "Shader analysis"
              if value.startswith("shader"): return "Shader processing"
              if value.startswith("build"): return "Build processing"
              if value.startswith("package"): return "IPA packaging"
              return None

          for line in sys.stdin:
              try:
                  event = json.loads(line)
              except (TypeError, ValueError):
                  continue
              label = category(event.get("name"))
              kind = event.get("ev")
              if not label:
                  continue
              if kind == "stage":
                  print(f"Build stage: {label}", flush=True)
              elif kind == "progress" and isinstance(event.get("frac"), (int, float)) and math.isfinite(event["frac"]):
                  percent = max(0, min(100, round(event["frac"] * 100)))
                  elapsed = event.get("elapsed")
                  suffix = f" ({round(elapsed)}s elapsed)" if isinstance(elapsed, (int, float)) and math.isfinite(elapsed) else ""
                  print(f"{label}: {percent}%{suffix}", flush=True)
              elif kind == "stage_end":
                  result = "complete" if event.get("ok") else "failed"
                  elapsed = event.get("elapsed")
                  suffix = f" ({round(elapsed)}s)" if isinstance(elapsed, (int, float)) and math.isfinite(elapsed) else ""
                  print(f"Build stage {result}: {label}{suffix}", flush=True)
          PY
          set +e
          python -u scripts/build_ipa_from_nsp.py "${args[@]}" --progress json 2>"$RUNNER_TEMP/build-diagnostics/conversion.stderr" \
            | tee "$RUNNER_TEMP/build-diagnostics/conversion.jsonl" \
            | python3 "$RUNNER_TEMP/sanitize-progress.py"
          statuses=("${PIPESTATUS[@]}")
          build_status="${statuses[0]}"
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            echo "::error::Private conversion failed; detailed diagnostics remain on EMS."
            exit "$build_status"
          fi
          if [[ "${statuses[1]:-0}" -ne 0 || "${statuses[2]:-0}" -ne 0 ]]; then
            echo "::error::Progress capture failed; detailed diagnostics remain on EMS."
            exit 1
          fi
          test -s "$RUNNER_TEMP/NxNative.ipa"

      - name: Return IPA privately to EMS
        env:
          BUILD_ID: ${{ inputs.build_id }}
          EMS_USER: ${{ secrets.EMS_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          base="/out/$BUILD_ID"
          cat > "$RUNNER_TEMP/put.sftp" <<EOF
          put "$RUNNER_TEMP/NxNative.ipa" "$base/NxNative.ipa"
          EOF
          if ! sftp -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -b "$RUNNER_TEMP/put.sftp" "$EMS_USER@ems.corvus-gamut.ts.net" > "$RUNNER_TEMP/private-output-transfer.log" 2>&1; then
            echo "::error::Private output transfer failed; detailed output withheld."
            exit 1
          fi
          echo "Build output transferred privately to EMS."

      - name: Save diagnostic reports privately to EMS
        if: always()
        continue-on-error: true
        env:
          BUILD_ID: ${{ inputs.build_id }}
          EMS_USER: ${{ secrets.EMS_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          # Best-effort: runners forcibly terminated by GitHub cannot guarantee post-job cleanup.
          [[ "$BUILD_ID" =~ ^[A-Za-z0-9_-]{12,40}$ ]] || exit 0
          [[ -s "$HOME/.ssh/id_ed25519" && -s "$HOME/.ssh/known_hosts" ]] || {
            echo "Private SSH setup never completed; no diagnostics to transfer"
            exit 0
          }
          umask 077
          diag="$RUNNER_TEMP/build-diagnostics"
          mkdir -p "$diag"
          if [[ -s "$diag/conversion.jsonl" ]]; then
            tail -n 250 "$diag/conversion.jsonl" > "$diag/build-tail.log"
          fi
          # Only short textual survey/profile reports, not extracted game data.
          survey=$(find "$RUNNER_TEMP/game-files" -type f -path '*/????????????????_survey/survey.md' -print -quit 2>/dev/null || true)
          profile=$(find "$RUNNER_TEMP/game-files" -type f -path '*/profile/????????????????/game.tsv' -print -quit 2>/dev/null || true)
          [[ -z "$survey" ]] || cp "$survey" "$diag/survey.md"
          [[ -z "$profile" ]] || cp "$profile" "$diag/game.tsv"
          # Shader-table mismatch: keep the *generated metadata tables* privately
          # for identity/order comparison, never shader bytecode or game assets.
          tbl=$(find "$RUNNER_TEMP/game-files" -type d -path '*/shader/pkg.partial/tables' -print -quit 2>/dev/null || true)
          if [[ -n "$tbl" ]]; then
            for fname in shader_map.tsv shader_facts.tsv shader_pairs.tsv; do
              [[ ! -s "$tbl/$fname" ]] || cp "$tbl/$fname" "$diag/$fname"
            done
          fi
          batch="$RUNNER_TEMP/save-diagnostics.sftp"
          printf '%s\n' "-mkdir /out/$BUILD_ID/diagnostics" > "$batch"
          count=0
          for name in resources.log build-tail.log conversion.jsonl conversion.stderr survey.md game.tsv shader_map.tsv shader_facts.tsv shader_pairs.tsv; do
            if [[ -s "$diag/$name" ]]; then
              printf 'put "%s" "/out/%s/diagnostics/%s"\n' "$diag/$name" "$BUILD_ID" "$name" >> "$batch"
              count=$((count + 1))
            fi
          done
          if [[ "$count" -eq 0 ]]; then
            echo "No build diagnostics were generated"
            exit 0
          fi
          if ! sftp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -b "$batch" "$EMS_USER@ems.corvus-gamut.ts.net" > "$RUNNER_TEMP/private-diagnostics-transfer.log" 2>&1; then
            echo "::warning::Private diagnostic transfer failed; details remain on this ephemeral runner."
            exit 1
          fi
          echo "Build diagnostics stored privately on EMS; none uploaded as GitHub artifacts."

      - name: Remove temporary private inputs
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/game-files" "$RUNNER_TEMP/private-inputs" "$RUNNER_TEMP/NxNative.ipa" "$RUNNER_TEMP/build-diagnostics"
          rm -f "$RUNNER_TEMP/private-inputs/game.tar"
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/get.sftp" "$RUNNER_TEMP/put.sftp" "$RUNNER_TEMP/save-diagnostics.sftp" "$RUNNER_TEMP/sanitize-progress.py" "$RUNNER_TEMP/private-input-transfer.log" "$RUNNER_TEMP/private-output-transfer.log" "$RUNNER_TEMP/private-diagnostics-transfer.log"
